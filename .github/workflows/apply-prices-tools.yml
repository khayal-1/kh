name: Apply prices tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python3 scripts/apply-prices-tools.py
      - name: Commit
        run: |
          git config user.name "khayal-1"
          git config user.email "motorselkhayal@gmail.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ui: implement prices tools from operations board left panel"
            git push
          fi
