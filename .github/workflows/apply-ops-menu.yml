name: Apply ops menu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply menu layout patch
        run: python3 scripts/apply-ops-menu.py
      - name: Commit and push
        run: |
          git config user.name "khayal-1"
          git config user.email "motorselkhayal@gmail.com"
          git add app.js style.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ui: reorganize staff/admin menu to match operations board"
            git push
          fi
