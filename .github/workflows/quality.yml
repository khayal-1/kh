name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "feature/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript syntax
        run: pnpm run check
      - name: Run unit tests
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Build production bundle
        run: pnpm run build
